# Generate the Xcode project with:  xcodegen generate   (https://github.com/yonaskolb/XcodeGen)
name: WVD
options:
  bundleIdPrefix: com.cinetec.wvm
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  WVDKit:
    path: WVDKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: 2
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  WVDHost:
    type: application
    platform: macOS
    sources:
      - path: WVDHost
        excludes: ["Info.plist", "WVDHost.entitlements"]
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: WVDKit
        product: WVDHostKit
      - package: WVDKit
        product: WVDAppleCore
    settings:
      base:
        PRODUCT_NAME: WVD Host
        PRODUCT_BUNDLE_IDENTIFIER: com.cinetec.wvm.host
        INFOPLIST_FILE: WVDHost/Info.plist
        CODE_SIGN_ENTITLEMENTS: WVDHost/WVDHost.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
schemes:
  WVDHost:
    build:
      targets:
        WVDHost: all
    run:
      config: Debug
