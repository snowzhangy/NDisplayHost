name: Windows host build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['windows/**', 'core/**', '.github/workflows/windows-host.yml']
  pull_request:
    paths: ['windows/**', 'core/**', '.github/workflows/windows-host.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      matrix:
        transport: [tcp, quic]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure and compile MSVC host and tests
        shell: cmd
        env:
          WVM_TRANSPORT: ${{ matrix.transport }}
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "WVM_VS_ROOT=%%i"
          if not defined WVM_VS_ROOT exit /b 1
          call "%WVM_VS_ROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b 1
          set "WVM_REQUIRE_MSQUIC=OFF"
          if "%WVM_TRANSPORT%"=="quic" (
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows\scripts\build-msquic.ps1
            if errorlevel 1 exit /b 1
            set "WVM_REQUIRE_MSQUIC=ON"
          )
          cmake -S windows -B windows/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DWVD_ENABLE_NVENC=OFF -DWVD_REQUIRE_MSQUIC=%WVM_REQUIRE_MSQUIC%
          if errorlevel 1 exit /b 1
          cmake --build windows/build-ci --parallel 4
      - name: Read the host version
        id: version
        shell: pwsh
        run: |
          # Single source of truth: windows/CMakeLists.txt.
          $cmake = Get-Content windows/CMakeLists.txt -Raw
          function Field([string]$name) {
            if ($cmake -match "(?m)^set\($name\s+(\d+)\)") { return $Matches[1] }
            throw "$name not found in windows/CMakeLists.txt"
          }
          "version=$(Field 'WVM_HOST_VERSION_MAJOR').$(Field 'WVM_HOST_VERSION_MINOR').$(Field 'WVM_HOST_VERSION_PATCH')" | Add-Content $env:GITHUB_OUTPUT
          "build=$(Field 'WVM_HOST_BUILD')" | Add-Content $env:GITHUB_OUTPUT
      - name: Run CPU and loopback regressions
        run: ctest --test-dir windows/build-ci -C Release --output-on-failure -R 'core-regressions|topology-regressions|wire1-codec-and-fec|quic-host-session|input-ipc|launcher-stop-and-network-validation'
      - name: Package desktop host
        shell: pwsh
        run: |
          $sourceRoot = (Resolve-Path windows/build-ci/src).Path
          Get-ChildItem $sourceRoot -Recurse -File | Where-Object {
            ($_.Extension -eq '.exe' -and $_.Name -ne 'wvd-quic-spike.exe') -or $_.Name -eq 'msquic.dll'
          } | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($sourceRoot, $_.FullName) -replace '(?i)(^|\\)Release\\', '$1'
            $target = Join-Path 'windows-host/src' $relative
            New-Item -ItemType Directory -Force (Split-Path -Parent $target) | Out-Null
            Copy-Item $_.FullName $target
          }
          if ('${{ matrix.transport }}' -eq 'quic') {
            if (!(Test-Path 'windows-host/src/media/msquic.dll')) { throw 'The package is missing MsQuic.' }
            Copy-Item windows/third_party/msquic/LICENSE windows-host/MsQuic-LICENSE.txt
            $quic = 'For QUIC, run src/media/wvd-media.exe --quic 47800. See the Windows host README for pairing.'
          }
          @"
          WVM Host ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }})

          Run src/ui/wvd-host.exe to start the Windows TCP development host (port 50001) on a trusted LAN.
          $quic
          For the separate virtual display driver, see windows/driver/README.md in the source repository.
          "@ | Set-Content windows-host/README.txt
      - uses: actions/upload-artifact@v7
        with:
          name: WVM-Host-${{ steps.version.outputs.version }}-build${{ steps.version.outputs.build }}-${{ matrix.transport }}
          path: windows-host/
          retention-days: 14
